<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat API Gallery</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #24589c; /* Fake store royal blue background */
            color: #333333;
            padding: 40px 12%;
            min-height: 100vh;
        }

        h1 {
            text-align: center;
            color: #ffffff;
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .error {
            background-color: #d9534f;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        /* Pure White Table Outer Box Wrapper */
        .table-container {
            background-color: #ffffff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 5px;
        }

        /* Steel-Blue Header */
        th {
            background-color: #245d93;
            color: #ffffff;
            padding: 16px 20px;
            font-weight: 600;
            font-size: 15px;
            text-align: left;
            letter-spacing: 0.3px;
        }

        th:first-child {
            border-top-left-radius: 10px;
            border-bottom-left-radius: 10px;
            text-align: center;
        }

        th:last-child {
            border-top-right-radius: 10px;
            border-bottom-right-radius: 10px;
        }

        td {
            padding: 15px 20px;
            font-size: 15px;
            color: #2c3e50;
            border-bottom: 1px solid #f1f4f8;
            vertical-align: middle;
        }

        /* Alternating striping row effect */
        tr:nth-child(even) td {
            background-color: #f8fafc;
        }

        tr:hover td {
            background-color: #edf2f7;
            transition: background-color 0.2s ease;
        }

        /* Round Circular Frame for Cat Images */
        .cat-thumb {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #245d93;
            display: block;
            margin: 0 auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .cat-id-text {
            font-weight: 600;
            color: #245d93;
        }
    </style>
</head>
<body>

    <h1>🐱 Cat API Gallery</h1>

    {% if error %}
    <div class="error">
        {{ error }}
    </div>
    {% endif %}

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="width: 20%; text-align: center;">Cat Image</th>
                    <th style="width: 80%;">Cat Unique ID</th>
                </tr>
            </thead>
            <tbody>
                {% for cat in cats %}
                <tr>
                    <td style="text-align: center;">
                        <img class="cat-thumb" src="{{ cat_api.image }}" alt="Cat Image">
                    </td>
                    <td>
                        <span class="cat-id-text">{{ cat_api.id }}</span>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

</body>
</html>
