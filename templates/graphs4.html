<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Food Retail Analytics</title>
    <style>
        /* Portfolio theme se match karta hua dark background */
        body { 
            background-color: #0f172a; 
            color: #f8fafc; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 20px; 
        }
        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 20px;
        }
        h2 {
            font-size: 2rem;
            margin-bottom: 10px;
            color: #38bdf8; /* Blue accent color */
        }
        p {
            color: #94a3b8;
            margin-bottom: 30px;
        }
        .back-btn {
            display: inline-block;
            text-decoration: none;
            color: #38bdf8;
            border: 1px solid #38bdf8;
            padding: 8px 16px;
            border-radius: 4px;
            margin-bottom: 20px;
            transition: 0.3s;
        }
        .back-btn:hover {
            background-color: #38bdf8;
            color: #0f172a;
        }
        /* PDF Viewer Frame Setup */
        .pdf-wrapper {
            width: 100%;
            height: 80vh; /* Browser screen ki 80% height lega */
            border: 2px solid #334155; 
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Back to Home Button -->
        <a href="/data_analytics" class="back-btn">← Back</a>

        <h2>Indian Food Retail Sales Dashboard</h2>
        <p>Full-Stack Data Pipeline: Synthetic Sales Generation, SQL Storage & Power BI Analytics</p>
        
        <!-- PDF container -->
        <div class="pdf-wrapper">
            <!-- Yahan aapki pdf load hogi static folder se -->
            <iframe src="{{ url_for('static', filename='docs/graphs4.pdf') }}"></iframe>
        </div>
    </div>
</body>
</html>
