<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nike Store - New Releases</title>
    <link rel="stylesheet" href="nike_store.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <h2>NIKE STORE</h2> 
        </div>
        <nav>
            <ul>
                <li><a href="#" class="active">New Releases</a></li>
                <li><a href="#">Men</a></li>
                <li><a href="#">Women</a></li>
                <li><a href="#">Kids</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h1 class="page-title">Men's New Releases</h1>
        
        <div class="product-grid">
            
            <div class="product-card">
                <div class="image-placeholder"></div>
                <div class="product-info">
                    <h3 class="product-title">Nike Air Max Dn</h3>
                    <p class="product-subtitle">Men's Shoes</p>
                    <p class="product-price">$160</p>
                </div>
            </div>

            <div class="product-card">
                <div class="image-placeholder"></div>
                <div class="product-info">
                    <h3 class="product-title">Nike Dunk Low Retro</h3>
                    <p class="product-subtitle">Shoes</p>
                    <p class="product-price">$115</p>
                </div>
            </div>

            <div class="product-card">
                <div class="image-placeholder"></div>
                <div class="product-info">
                    <h3 class="product-title">Nike Vapor Fly 3</h3>
                    <p class="product-subtitle">Road Racing Shoes</p>
                    <p class="product-price">$260</p>
                </div>
            </div>

            <div class="product-card">
                <div class="image-placeholder"></div>
                <div class="product-info">
                    <h3 class="product-title">Nike Air Force 1 '07</h3>
                    <p class="product-subtitle">Men's Shoes</p>
                    <p class="product-price">$115</p>
                </div>
            </div>

        </div>
    </main>

</body>
</html>
