<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Sales Analytics Dashboard</title>
    <style>
        /* Portfolio Dark Slate Theme */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body { 
            background-color: #0f172a; 
            color: #f8fafc; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            min-height: 100vh;
            padding: 20px; 
        }
        .container { 
            max-width: 1100px; 
            margin: 0 auto; 
            padding: 20px 0;
        }

        /* Top Bar Navigation */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: #38bdf8;
            border: 1px solid #38bdf8;
            padding: 8px 18px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .back-btn:hover {
            background-color: #38bdf8;
            color: #0f172a;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
        }

        .action-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            background-color: #1e293b;
            color: #f8fafc;
            border: 1px solid #334155;
            padding: 8px 18px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .action-btn:hover {
            background-color: #334155;
            border-color: #38bdf8;
            color: #38bdf8;
        }

        /* Header Text */
        .header-content {
            text-align: center;
            margin-bottom: 30px;
        }
        h2 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: #38bdf8;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        p.subtitle {
            color: #94a3b8;
            font-size: 1.05rem;
            max-width: 700px;
            margin: 0 auto;
            line-height: 1.5;
        }

        /* PDF Viewer Container */
        .pdf-wrapper {
            width: 100%;
            height: 80vh; /* Browser screen ki 80% height lega */
            background-color: #1e293b;
            border: 2px solid #334155; 
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Responsive Layout Adjustments */
        @media (max-width: 768px) {
            body { padding: 12px; }
            h2 { font-size: 1.75rem; }
            p.subtitle { font-size: 0.95rem; }
            .pdf-wrapper { height: 65vh; }
            .top-bar { justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- Top Action Navigation -->
        <div class="top-bar">
            <a href="/data_analytics" class="back-btn">← Back </a>
            <!-- Correct Path to open PDF in new tab -->
            <a href="{{ url_for('static', filename='docs/dashbord5.pdf') }}" target="_blank" class="action-btn">
                <span>📄 Open Full PDF</span>
            </a>
        </div>

        <!-- Header Content -->
        <header class="header-content">
            <h2>E-Commerce Sales Analytics Dashboard</h2>
            <p class="subtitle">Interactive Visualizations: Product ID Count vs. Sum of Cost Price by Vendor</p>
        </header>
        
        <!-- PDF Embedded Viewer Section -->
        <main class="pdf-wrapper">
            <!-- Correct Path pointing to docs/dashbord5.pdf -->
            <iframe src="{{ url_for('static', filename='docs/dashbord5.pdf') }}#toolbar=1&navpanes=0">
                <p>Your browser does not support embedded PDFs. 
                   <a href="{{ url_for('static', filename='docs/dashbord5.pdf') }}">Click here to view PDF</a>.
                </p>
            </iframe>
        </main>

    </div>
</body>
</html>
