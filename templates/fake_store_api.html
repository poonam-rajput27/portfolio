<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Store API - Premium Tabular Edition</title>
    
    <style>
        /* The !important flag forces the browser to drop the old cached background immediately */
        html, body {
            background: linear-gradient(135deg, #2b5c9e, #1e3c72) !important;
            background-color: #1e3c72 !important;
            min-height: 100vh !important;
            margin: 0 !important;
            padding: 40px 20px !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- Header Styles --- */
        h1 {
            color: #ffffff !important;
            font-size: 2.2rem;
            margin-bottom: 30px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* --- Error Panel --- */
        .error {
            background-color: #fee2e2;
            border-left: 4px solid #ef4444;
            color: #991b1b;
            padding: 15px;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 20px;
            border-radius: 6px;
            box-sizing: border-box;
        }

        /* --- White Container Card --- */
        .table-canvas {
            background-color: #ffffff !important;
            width: 100%;
            max-width: 1100px;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            overflow-x: auto;
            box-sizing: border-box;
        }

        /* --- Table Configuration --- */
        .custom-premium-table {
            width: 100%;
            border-collapse: collapse;
            background-color: #ffffff;
        }

        .custom-premium-table thead tr {
            background-color: #245796 !important;
            color: #ffffff !important;
        }

        .custom-premium-table th {
            padding: 16px 14px;
            font-size: 0.95rem;
            font-weight: 600;
            text-align: center;
            border: none;
        }

        .custom-premium-table th:first-child { border-top-left-radius: 8px; border-bottom-left-radius: 8px; }
        .custom-premium-table th:last-child { border-top-right-radius: 8px; border-bottom-right-radius: 8px; }

        .custom-premium-table td {
            padding: 14px;
            font-size: 0.95rem;
            color: #334155 !important;
            border-bottom: 1px solid #f1f5f9;
            vertical-align: middle;
            text-align: center;
        }

        .custom-premium-table tbody tr:nth-child(even) {
            background-color: #f8fafc !important;
        }

        .custom-premium-table tbody tr:hover {
            background-color: #f1f5f9 !important;
        }

        .text-left {
            text-align: left !important;
        }

        .serial-number {
            font-weight: 600;
            color: #64748b;
        }

        .product-thumb {
            width: 45px;
            height: 45px;
            object-fit: contain;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: block;
            margin: 0 auto;
        }

        .product-title {
            font-weight: 500;
            color: #1e293b;
            margin: 0;
        }

        .category-text {
            color: #2563eb;
            font-weight: 500;
        }

        .price-badge {
            font-weight: 600;
            color: #0f172a;
        }

        .rating-text {
            font-weight: 500;
            color: #475569;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <h1>🛍️ Fake Store Products</h1>

    {% if error %}
    <div class="error">
        {{ error }}
    </div>
    {% endif %}

    <div class="table-canvas">
        <table class="custom-premium-table">
            <thead>
                <tr>
                    <th style="width: 8%;">S.No</th>
                    <th style="width: 12%;">Image</th>
                    <th class="text-left" style="width: 45%;">Product Title</th>
                    <th style="width: 15%;">Category</th>
                    <th style="width: 10%;">Price</th>
                    <th style="width: 10%;">Rating</th>
                </tr>
            </thead>
            <tbody>
                {% for product in products %}
                <tr>
                    <td>
                        <span class="serial-number">{{ loop.index }}</span>
                    </td>
                    <td>
                        <img class="product-thumb" src="{{ product.image }}" alt="{{ product.title }}">
                    </td>
                    <td class="text-left">
                        <p class="product-title">{{ product.title }}</p>
                    </td>
                    <td>
                        <span class="category-text">{{ product.category }}</span>
                    </td>
                    <td>
                        <span class="price-badge">${{ product.price }}</span>
                    </td>
                    <td>
                        <span class="rating-text">⭐ {{ product.rating }}</span>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

</body>
</html>
